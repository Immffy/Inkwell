name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 复用运行机预装的 Android SDK，不要自己设空目录的 ANDROID_HOME
      # （那样会逼 AGP 从头下载整套 SDK，最终超时失败）
      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK/licenses/android-sdk-preview-license"
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a' > "$SDK/licenses/intel-android-extra-license"
          ls -la "$SDK"

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          VER=$(grep -E 'val version(Major|Minor|Patch) = ' app/build.gradle.kts | grep -oE '[0-9]+' | paste -sd.)
          echo "检测到版本 v$VER"
          for f in out/*.apk; do mv "$f" "out/墨境-v$VER.apk"; done
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkwell-apk
          path: out/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 安装

            1. 下载下面的 APK（debug 版即可用）
            2. 已装旧版可**直接覆盖安装**，不用卸载
            3. LSPosed → 模块 → 启用 → **勾作用域「系统框架 / android」和「墨境」**
            4. **重启手机**

            恢复默认显示：主界面红色按钮，或下拉通知栏的「墨境」磁贴。

            ## 更新日志

            见 CHANGELOG.md
          files: out/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
