name: Build APK

on:
  workflow_dispatch:    # 手动触发：手机上点一下就能编译
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]      # 打 v0.2.0 这类 tag 时自动发 Release

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # tag 触发时需要权限创建 Release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 固定 Gradle 版本，避免 runner 预装版本与 AGP 不兼容
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eink-mode-apk
          path: out/*.apk
          retention-days: 30

      # 只有 push tag 时才创建 Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## 安装

            1. 下载下面的 APK（debug 版即可用）
            2. 若装过旧版本，先卸载
            3. LSPosed → 模块 → 启用 → **勾作用域「系统框架 / android」**
            4. **重启手机**

            详细步骤见仓库内《怎么用.md》。

            ## 更新日志

            见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          files: out/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
